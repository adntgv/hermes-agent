<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f3ec" />
  <title>Hermes Report</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/miniapp/assets/styles.css?v=report-reader-20260711" />
</head>
<body>
  <main class="report-app" data-config-url="/miniapp/config.json">
    <header class="app-toolbar" aria-label="Report controls">
      <div>
        <p class="kicker">Hermes Report</p>
        <h1 id="report-title">Latest report</h1>
      </div>
      <nav class="toolbar-actions" aria-label="Actions">
        <button id="refresh-report" class="icon-button" type="button" aria-label="Refresh report">↻</button>
        <button id="close-miniapp" class="icon-button" type="button" aria-label="Close">×</button>
      </nav>
    </header>

    <section id="status" class="status" role="status" aria-live="polite">Loading latest report.</section>
    <article id="report" class="report" aria-live="polite" hidden></article>
  </main>
  <script src="/miniapp/assets/app.js?v=report-reader-20260711"></script>
</body>
</html>
